<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Линия красоты Хогарта</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
:root{--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-success:#3b6d11;--text-danger:#a32d2d;--text-warning:#854f0b;--text-accent:#185fa5;--border:rgba(0,0,0,.15);--bg:#faf9f5}
@media (prefers-color-scheme:dark){:root{--text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-success:#97c459;--text-danger:#f09595;--text-warning:#fac775;--text-accent:#85b7eb;--border:rgba(255,255,255,.18);--bg:#1f1e1d}}
body{margin:0 auto;padding:16px;max-width:680px;background:var(--bg);color:var(--text-primary);font:16px/1.5 system-ui,sans-serif}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button,select{font:inherit;font-size:14px;padding:4px 10px;border-radius:8px;border:.5px solid var(--border);background:transparent;color:inherit;cursor:pointer}
</style></head><body>
<h2 class="sr-only">Семь S-линий по мотивам таблицы Хогарта, от почти прямой до перегнутой; ползунок меняет изгиб, под линией показан график кривизны.</h2>
<div style="display:grid;grid-template-columns:auto minmax(0,1fr) 150px;gap:8px 12px;align-items:center;margin:0 0 10px;font-size:14px;">
  <label for="b" style="color:var(--text-secondary);">Изгиб</label>
  <input type="range" id="b" min="0" max="1.6" step="0.01" value="0.8">
  <span id="bv" style="font-weight:500;">46° · линия 4</span>
</div>
<div style="display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:0 0 10px;font-size:14px;">
  <label style="color:var(--text-secondary);display:flex;align-items:center;gap:6px;"><input type="checkbox" id="kink"> Сравнить с ломаной</label>
  <span id="info" style="font-size:13px;color:var(--text-secondary);"></span>
</div>
<div style="border:0.5px solid var(--border);border-radius:12px;overflow:hidden;">
  <canvas id="cv" style="display:block;width:100%;height:auto;touch-action:manipulation;cursor:pointer;"></canvas>
</div>
<div style="display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--text-secondary);margin-top:8px;">
  <span><span style="display:inline-block;width:14px;height:3px;background:var(--text-primary);vertical-align:middle;"></span> S-линия</span>
  <span><span style="display:inline-block;width:14px;height:3px;background:#D85A30;vertical-align:middle;"></span> кривизна вдоль линии</span>
  <span><span style="display:inline-block;width:14px;height:3px;background:#7F77DD;vertical-align:middle;"></span> ломаная и её изломы</span>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const css=(n,f)=>getComputedStyle(document.body).getPropertyValue(n).trim()||f;
const W=680,H=470,cv=$('cv'),DPR=window.devicePixelRatio||1,NS=400,NK=6;
cv.width=W*DPR;cv.height=H*DPR;
const ctx=cv.getContext('2d');
const HB=k=>0.2*k;
function sline(b){const pts=[{x:0,y:0}];let x=0,y=0;for(let i=1;i<=NS;i++){const s=(i-0.5)/NS,th=b*Math.sin(2*Math.PI*s);x+=Math.sin(th)/NS;y+=Math.cos(th)/NS;pts.push({x,y});}return pts;}
const kappa=(b,s)=>2*Math.PI*b*Math.cos(2*Math.PI*s);
function fit(pts,cx,cy,h){const y1=pts[pts.length-1].y,x0=pts[0].x,x1=pts[pts.length-1].x,sc=h;return pts.map(p=>({x:cx+(p.x-(x0+x1)/2)*sc,y:cy+y1*sc/2-p.y*sc}));}
function stroke(pts,col,w){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineJoin='round';ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();}
function nearest(b){let k=1,d=1e9;for(let i=1;i<=7;i++){const e=Math.abs(HB(i)-b);if(e<d){d=e;k=i;}}return k;}
const cells=[];
function draw(){
  const b=+$('b').value,tp=css('--text-primary','#222'),ts=css('--text-secondary','#666'),k=nearest(b),deg=Math.round(b*180/Math.PI);
  $('bv').textContent=deg+'° · ближе к линии '+k;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  cells.length=0;
  for(let i=1;i<=7;i++){
    const cx=48+(i-1)*97,cy=86;cells.push({x:cx-44,y:10,w:88,h:160,b:HB(i)});
    if(i===k){ctx.fillStyle='rgba(216,90,48,0.10)';ctx.fillRect(cx-44,10,88,160);}
    stroke(fit(sline(HB(i)),cx,cy,120),i===4?'#D85A30':tp,i===4?3:2);
    ctx.fillStyle=i===4?'#D85A30':ts;ctx.font=(i===4?'500 ':'')+'13px sans-serif';ctx.textAlign='center';ctx.fillText(String(i),cx,166);
  }
  ctx.fillStyle='#D85A30';ctx.font='12px sans-serif';ctx.fillText('линия красоты',48+3*97,182);
  const big=fit(sline(b),150,330,230);stroke(big,tp,3.5);
  const kink=$('kink').checked;
  let poly=null;
  if(kink){const idx=[];for(let j=0;j<=NK;j++)idx.push(Math.round(j*NS/NK));poly=idx.map(i=>big[i]);stroke(poly,'#7F77DD',2);poly.forEach(p=>{ctx.fillStyle='#7F77DD';ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,Math.PI*2);ctx.fill();});}
  const gx=320,gy=215,gw=335,gh=230,kmax=2*Math.PI*1.6,my=gy+gh/2,ky=(gh/2-12)/kmax;
  ctx.strokeStyle=ts;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(gx,my);ctx.lineTo(gx+gw,my);ctx.moveTo(gx,gy);ctx.lineTo(gx,gy+gh);ctx.stroke();
  ctx.fillStyle=ts;ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillText('кривизна',gx+6,gy+12);ctx.textAlign='right';ctx.fillText('вдоль линии →',gx+gw,my+16);
  ctx.strokeStyle='#D85A30';ctx.lineWidth=2.5;ctx.beginPath();for(let i=0;i<=200;i++){const s=i/200,X=gx+s*gw,Y=my-kappa(b,s)*ky;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);}ctx.stroke();
  let info='Наибольшая кривизна '+(2*Math.PI*b).toFixed(1).replace('.',',')+' на длину линии; кривизна меняется плавно и дважды меняет знак — это и даёт S.';
  if(kink){
    const idx=[];for(let j=0;j<=NK;j++)idx.push(Math.round(j*NS/NK));
    const pl=sline(b),P=idx.map(i=>pl[i]);let turnMax=0;
    ctx.strokeStyle='#7F77DD';ctx.fillStyle='#7F77DD';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(gx,my-2);ctx.lineTo(gx+gw,my-2);ctx.stroke();
    for(let j=1;j<NK;j++){
      const a=Math.atan2(P[j].x-P[j-1].x,P[j].y-P[j-1].y),c=Math.atan2(P[j+1].x-P[j].x,P[j+1].y-P[j].y),turn=c-a;turnMax=Math.max(turnMax,Math.abs(turn));
      const X=gx+j/NK*gw,Y=my-Math.sign(turn)*(gh/2-14);
      ctx.beginPath();ctx.moveTo(X,my);ctx.lineTo(X,Y);ctx.stroke();
      ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X-5,Y+Math.sign(turn)*8);ctx.lineTo(X+5,Y+Math.sign(turn)*8);ctx.closePath();ctx.fill();
    }
    info='У ломаной кривизна на отрезках равна нулю, а в вершинах — бесконечный скачок: направление меняется сразу до '+Math.round(turnMax*180/Math.PI)+'°. Глаз видит это как излом.';
  }
  $('info').textContent=info;
}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;const c=cells.find(c=>x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h);if(c){$('b').value=c.b;draw();}});
$('b').addEventListener('input',draw);$('kink').addEventListener('change',draw);
window.__hg={sline,kappa,draw};
draw();
})();
</script>

</body></html>

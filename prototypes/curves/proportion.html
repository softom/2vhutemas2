<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пропорция</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
:root{--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-success:#3b6d11;--text-danger:#a32d2d;--text-warning:#854f0b;--text-accent:#185fa5;--border:rgba(0,0,0,.15);--bg:#faf9f5}
@media (prefers-color-scheme:dark){:root{--text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-success:#97c459;--text-danger:#f09595;--text-warning:#fac775;--text-accent:#85b7eb;--border:rgba(255,255,255,.18);--bg:#1f1e1d}}
body{margin:0 auto;padding:16px;max-width:680px;background:var(--bg);color:var(--text-primary);font:16px/1.5 system-ui,sans-serif}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button,select{font:inherit;font-size:14px;padding:4px 10px;border-radius:8px;border:.5px solid var(--border);background:transparent;color:inherit;cursor:pointer}
</style></head><body>
<h2 class="sr-only">Пропорции: деление целого на части, подобие части целому и человек как мера по Витрувию; сравнение канонов целых отношений и золотого сечения.</h2>
<div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin:0 0 10px;font-size:14px;" role="radiogroup" aria-label="Часть">
  <label style="display:flex;align-items:center;gap:6px;"><input type="radio" name="part" value="split" checked> Деление целого</label>
  <label style="display:flex;align-items:center;gap:6px;"><input type="radio" name="part" value="similar"> Часть и целое</label>
  <label style="display:flex;align-items:center;gap:6px;"><input type="radio" name="part" value="body"> Человек как мера</label>
</div>
<div id="c-split" style="display:grid;grid-template-columns:auto minmax(0,1fr) 64px;gap:8px 12px;align-items:center;margin:0 0 10px;font-size:14px;">
  <label for="x" style="color:var(--text-secondary);">Большая часть</label>
  <input type="range" id="x" min="0.5" max="0.8" step="0.001" value="0.6">
  <span id="xv" style="font-weight:500;font-variant-numeric:tabular-nums;">60 %</span>
</div>
<div id="c-similar" style="display:none;grid-template-columns:auto minmax(0,1fr) 64px;gap:8px 12px;align-items:center;margin:0 0 10px;font-size:14px;">
  <label for="r" style="color:var(--text-secondary);">Стороны</label>
  <input type="range" id="r" min="1.2" max="2.2" step="0.0001" value="1.5">
  <span id="rv" style="font-weight:500;font-variant-numeric:tabular-nums;">1,500</span>
</div>
<div id="c-body" style="display:none;grid-template-columns:auto minmax(0,1fr) 64px;gap:8px 12px;align-items:center;margin:0 0 10px;font-size:14px;">
  <label for="span" style="color:var(--text-secondary);">Размах рук / рост</label>
  <input type="range" id="span" min="0.9" max="1.1" step="0.005" value="1">
  <span id="spanv" style="font-weight:500;font-variant-numeric:tabular-nums;">1,00</span>
  <label for="nav" style="color:var(--text-secondary);">Пупок, доля роста</label>
  <input type="range" id="nav" min="0.5" max="0.7" step="0.002" value="0.6">
  <span id="navv" style="font-weight:500;font-variant-numeric:tabular-nums;">0,600</span>
</div>
<div id="c-body2" style="display:none;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:0 0 10px;font-size:14px;">
  <label style="color:var(--text-secondary);display:flex;align-items:center;gap:6px;"><input type="checkbox" id="mod" checked> Модули: восьмые доли роста</label>
  <label style="color:var(--text-secondary);display:flex;align-items:center;gap:6px;"><input type="checkbox" id="phi"> Линия золотого сечения</label>
</div>
<div id="snaps" style="display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;"></div>
<div id="info" style="font-size:13px;margin:0 0 8px;min-height:40px;color:var(--text-secondary);"></div>
<div style="border:0.5px solid var(--border);border-radius:12px;overflow:hidden;">
  <canvas id="cv" style="display:block;width:100%;height:auto;touch-action:none;"></canvas>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const css=(n,f)=>getComputedStyle(document.body).getPropertyValue(n).trim()||f;
const W=680,H=440,cv=$('cv'),DPR=window.devicePixelRatio||1,PHI=(1+Math.sqrt(5))/2;
cv.width=W*DPR;cv.height=H*DPR;
const ctx=cv.getContext('2d');
const f3=v=>v.toFixed(3).replace('.',','),f2=v=>v.toFixed(2).replace('.',',');
const CANON=[['1 : 1',1],['4 : 3',4/3],['√2',Math.SQRT2],['3 : 2',1.5],['φ',PHI],['5 : 3',5/3],['2 : 1',2]];
const part=()=>document.querySelector('input[name=part]:checked').value;
const ORANGE='#D85A30',GREEN='#1D9E75',PURPLE='#7F77DD',BLUE='#378ADD';
function snaps(){
  const p=part(),box=$('snaps');box.innerHTML='';
  if(p==='body')return;
  CANON.forEach(([t,v])=>{const b=document.createElement('button');b.textContent=t;b.style.fontSize='13px';b.addEventListener('click',()=>{if(p==='split'){$('x').value=v/(1+v);}else{$('r').value=Math.min(2.2,Math.max(1.2,v));}draw();});box.appendChild(b);});
}
function nearest(v){let best=null,d=1e9;CANON.forEach(([t,c])=>{const e=Math.abs(v-c)/c;if(e<d){d=e;best=t;}});return d<0.006?best:null;}
function drawSplit(){
  const x=+$('x').value,a=x,b=1-x,r1=a/b,r2=1/a,tp=css('--text-primary','#222'),ts=css('--text-secondary','#666');
  $('xv').textContent=Math.round(x*1000)/10+' %';
  const L=560,X0=60,Y=70,xa=X0+L*a;
  ctx.lineWidth=6;ctx.lineCap='round';ctx.strokeStyle=ORANGE;ctx.beginPath();ctx.moveTo(X0,Y);ctx.lineTo(xa,Y);ctx.stroke();ctx.strokeStyle=PURPLE;ctx.beginPath();ctx.moveTo(xa,Y);ctx.lineTo(X0+L,Y);ctx.stroke();ctx.lineCap='butt';
  ctx.fillStyle=tp;ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('a',(X0+xa)/2,Y-14);ctx.fillText('b',(xa+X0+L)/2,Y-14);
  const FW=560,FH=FW/r2,FY=110;
  const fh=Math.min(FH,300),fw=fh*r2,fx=(W-fw)/2;
  ctx.fillStyle='rgba(216,90,48,0.12)';ctx.fillRect(fx,FY,fw*a,fh);ctx.fillStyle='rgba(127,119,221,0.12)';ctx.fillRect(fx+fw*a,FY,fw*b,fh);
  ctx.strokeStyle=tp;ctx.lineWidth=1.5;ctx.strokeRect(fx,FY,fw,fh);ctx.strokeStyle=ts;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(fx+fw*a,FY);ctx.lineTo(fx+fw*a,FY+fh);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=ts;ctx.font='12px sans-serif';ctx.fillText('фасад: ширина a + b, высота a',W/2,FY+fh+18);
  const gy=FY+fh+44;if(gy<H-10){ctx.textAlign='left';ctx.fillStyle=tp;ctx.font='14px sans-serif';ctx.fillText('a : b = '+f3(r1)+'      (a + b) : a = '+f3(r2),X0,gy);}
  const same=Math.abs(r1-r2)<0.004,nm=nearest(r1);
  $('info').innerHTML=(same?'<span style="color:var(--text-success)">Отношения совпали: большая часть так относится к меньшей, как целое к большей. Это золотое сечение, φ = 1,618…</span>':'Часть к части — '+f3(r1)+', целое к большей части — '+f3(r2)+'. Двигайте ползунок, пока они не совпадут.')+(nm&&!same?' Сейчас a : b — ровно '+nm+'.':'');
}
function drawSimilar(){
  const r=+$('r').value,tp=css('--text-primary','#222'),ts=css('--text-secondary','#666');
  $('rv').textContent=f3(r);
  const h=Math.min(360/1,(W-80)/r),w=h*r,x0=(W-w)/2,y0=(H-h)/2+6;
  ctx.strokeStyle=tp;ctx.lineWidth=2;ctx.strokeRect(x0,y0,w,h);
  let x=x0,y=y0,cw=w,ch=h,dir=0;const ratios=[];
  for(let i=0;i<7;i++){
    const long=Math.max(cw,ch),short=Math.min(cw,ch);if(short<2)break;
    ratios.push(long/short);
    if(Math.abs(long-short)<0.5){ctx.fillStyle='rgba(29,158,117,0.15)';ctx.fillRect(x,y,cw,ch);break;}
    const s=short;let sq;
    if(dir===0){sq=[x,y,s,s];x+=s;cw-=s;}else if(dir===1){sq=[x,y,s,s];y+=s;ch-=s;}else if(dir===2){sq=[x+cw-s,y,s,s];cw-=s;}else{sq=[x,y+ch-s,s,s];ch-=s;}
    if(cw<ch&&dir===0)dir=1;else if(ch<cw&&dir===1)dir=2;else if(cw<ch&&dir===2)dir=3;else if(ch<cw&&dir===3)dir=0;
    const sim=Math.abs(ratios[ratios.length-1]-r)/r<0.01;
    ctx.fillStyle=sim?'rgba(216,90,48,0.10)':'rgba(127,119,221,0.10)';ctx.fillRect(...sq);ctx.strokeStyle=ts;ctx.lineWidth=1;ctx.strokeRect(...sq);
    const [sx,sy,ss]=sq,k=i%4,cx=[sx+ss,sx,sx,sx+ss][k],cy=[sy+ss,sy+ss,sy,sy][k],a0=[Math.PI,1.5*Math.PI,0,0.5*Math.PI][k];
    ctx.strokeStyle=ORANGE;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,ss,a0,a0+Math.PI/2);ctx.stroke();
  }
  const rest=ratios.slice(1),simAt=rest.map(v=>Math.abs(v-r)/r<0.01),sim=simAt.filter(Boolean).length;
  const every2=rest.length>=4&&simAt.every((v,i)=>v===(i%2===1));
  let msg;
  if(rest.length&&sim===rest.length)msg='<span style="color:var(--text-success)">Каждый остаток подобен целому — деление могло бы идти бесконечно. Это возможно только при φ.</span>';
  else if(every2)msg='<span style="color:var(--text-success)">Подобен целому каждый второй остаток: так устроен прямоугольник √2 — формат листа A4, который делится пополам без потери пропорции.</span>';
  else msg='Остаток '+(sim?'подобен целому лишь '+sim+' раз':'не подобен целому')+', и ряд ломается.';
  $('info').innerHTML='От прямоугольника отрезается квадрат, от остатка — снова квадрат. Отношения сторон: '+ratios.map(f2).join(' → ')+'. '+msg;
}
function drawBody(){
  const sp=+$('span').value,n=+$('nav').value,tp=css('--text-primary','#222'),ts=css('--text-secondary','#666');
  $('spanv').textContent=f2(sp);$('navv').textContent=f3(n);
  const gy=H-24,Hh=Math.min(330,(gy-14)/Math.max(1,2*n)),cx=W/2,Y=v=>gy-v*Hh,X=v=>cx+v*Hh;
  if($('mod').checked){ctx.strokeStyle=ts;ctx.lineWidth=0.6;ctx.setLineDash([2,4]);for(let k=0;k<=8;k++){ctx.beginPath();ctx.moveTo(X(-0.62),Y(k/8));ctx.lineTo(X(0.62),Y(k/8));ctx.stroke();ctx.fillStyle=ts;ctx.font='11px sans-serif';ctx.textAlign='right';ctx.fillText(k+'/8',X(-0.64),Y(k/8)+4);}ctx.setLineDash([]);}
  if($('phi').checked){const p=1/PHI;ctx.strokeStyle=GREEN;ctx.lineWidth=1.5;ctx.setLineDash([8,4]);ctx.beginPath();ctx.moveTo(X(-0.62),Y(p));ctx.lineTo(X(0.62),Y(p));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=GREEN;ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillText('0,618 роста',X(0.64),Y(p)+4);}
  const sq=sp;ctx.strokeStyle=BLUE;ctx.lineWidth=2;ctx.strokeRect(X(-Math.max(sq,1)/2),Y(1),Math.max(sq,1)*Hh,Hh);
  const R=n;ctx.strokeStyle=ORANGE;ctx.beginPath();ctx.arc(X(0),Y(n),R*Hh,0,Math.PI*2);ctx.stroke();
  const head=1/8,shY=1-1/6,sh=1/8,hip=0.5,arm=sp/2-sh;
  const line=(a,b,c,d,col,w)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(X(a),Y(b));ctx.lineTo(X(c),Y(d));ctx.stroke();};
  ctx.lineCap='round';
  ctx.strokeStyle=tp;ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(X(0),Y(1-head/2),head*0.38*Hh,head/2*Hh,0,0,Math.PI*2);ctx.stroke();
  line(0,1-head,0,hip,tp,3);line(-sh,shY,sh,shY,tp,3);
  line(-sh,shY,-sh-arm,shY,tp,2.5);line(sh,shY,sh+arm,shY,tp,2.5);
  line(0,hip,-0.05,0,tp,3);line(0,hip,0.05,0,tp,3);
  const reach=(from,len)=>{const d=Math.hypot(from.x,from.y-n);return{min:Math.abs(d-len),max:d+len};};
  const onCircle=(from,len,ang0)=>{let best=null;for(let a=0;a<Math.PI*2;a+=0.002){const p={x:from.x+len*Math.cos(a),y:from.y+len*Math.sin(a)};const e=Math.abs(Math.hypot(p.x,p.y-n)-R);const pref=Math.abs(Math.atan2(Math.sin(a-ang0),Math.cos(a-ang0)));if(e<0.002&&(!best||pref<best.pref))best={p,pref};}return best&&best.p;};
  const ghost='rgba(127,119,221,0.9)';let handsOk=true,feetOk=true;
  [-1,1].forEach(s=>{
    const S={x:s*sh,y:shY},h=onCircle(S,arm,s>0?Math.PI/5:Math.PI-Math.PI/5);
    if(h)line(S.x,S.y,h.x,h.y,ghost,2);else handsOk=false;
    const P={x:0,y:hip},f=onCircle(P,hip,s>0?-Math.PI/2+0.45:-Math.PI/2-0.45);
    if(f)line(0,hip,f.x,f.y,ghost,2);else feetOk=false;
  });
  ctx.lineCap='butt';
  ctx.fillStyle=ORANGE;ctx.beginPath();ctx.arc(X(0),Y(n),5,0,Math.PI*2);ctx.fill();ctx.font='12px sans-serif';ctx.textAlign='left';ctx.fillText('пупок — центр круга',X(0.03),Y(n)-6);
  const sqOk=Math.abs(sp-1)<0.006;
  const msgs=[];
  msgs.push(sqOk?'<span style="color:var(--text-success)">Размах рук равен росту — фигура вписана в квадрат.</span>':'Размах рук '+(sp>1?'больше':'меньше')+' роста — квадрат уже не квадрат.');
  msgs.push(handsOk&&feetOk?'<span style="color:var(--text-success)">Поднятые руки и расставленные ноги достают до круга с центром в пупке.</span>':'<span style="color:var(--text-danger)">Руки или ноги не достают до круга с центром в пупке.</span>');
  msgs.push('Пупок на '+f3(n)+' роста; золотое сечение дало бы 0,618, восьмые доли — 0,625 или 0,500.');
  $('info').innerHTML=msgs.join(' ');
}
function draw(){
  const p=part();
  $('c-split').style.display=p==='split'?'grid':'none';$('c-similar').style.display=p==='similar'?'grid':'none';$('c-body').style.display=p==='body'?'grid':'none';$('c-body2').style.display=p==='body'?'flex':'none';
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  p==='split'?drawSplit():p==='similar'?drawSimilar():drawBody();
}
document.querySelectorAll('input[name=part]').forEach(r=>r.addEventListener('change',()=>{snaps();draw();}));
['x','r','span','nav'].forEach(id=>$(id).addEventListener('input',draw));
['mod','phi'].forEach(id=>$(id).addEventListener('change',draw));
window.__pr={draw,PHI};
snaps();draw();
})();
</script>

</body></html>

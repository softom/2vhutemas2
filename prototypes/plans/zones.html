<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Профили площадей</title>
<style>
:root{--text-primary:#1f1e1d;--text-secondary:#5f5e5a;--text-success:#3b6d11;--text-danger:#a32d2d;--text-warning:#854f0b;--text-accent:#185fa5;--border:rgba(0,0,0,.15);--bg:#faf9f5;--card:#fff}
@media (prefers-color-scheme:dark){:root{--text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-success:#97c459;--text-danger:#f09595;--text-warning:#fac775;--text-accent:#85b7eb;--border:rgba(255,255,255,.18);--bg:#1f1e1d;--card:#2c2c2a}}
body{margin:0 auto;padding:16px;max-width:680px;background:var(--bg);color:var(--text-primary);font:16px/1.5 system-ui,sans-serif}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
button,select,input{font:inherit;font-size:14px;padding:4px 10px;border-radius:8px;border:.5px solid var(--border);background:transparent;color:inherit}
button{cursor:pointer}
</style></head><body>
<h2 class="sr-only">Игра «Профили площадей»: лепестковая диаграмма показывает, как зрелищное здание делит площадь между семью частями; профили театра, концертного зала, стадиона, крытой арены и экрана по документам заказчиков; пример сопоставляется со стандартом типа, программа — с профилями типов.</h2>
<style>
.zn-tabs,.zn-types{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.zn-tabs button[aria-pressed=true],.zn-types button[aria-pressed=true]{background:#A9381F;border-color:#A9381F;color:#fff}
.zn-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.zn-svg{width:100%;max-width:560px;height:auto;display:block;margin:0 auto}
.zn-svg text{font:12px system-ui,sans-serif;fill:var(--text-secondary)}
.zn-side{font-size:16px}
.zn-side table{border-collapse:collapse;width:100%;font-size:16px}
.zn-side td,.zn-side th{padding:6px 6px;border-bottom:.5px solid var(--border);text-align:right;font-weight:400}
.zn-side td:first-child,.zn-side th:first-child{text-align:left}
.zn-side th{color:var(--text-secondary)}
.zn-msg{margin:8px 0;font-size:16px}
.zn-key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--text-secondary);margin:6px 0 0}
.zn-key i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:4px}
.zn-in{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:6px 10px;align-items:center;font-size:16px}
.zn-in input{width:92px;text-align:right}
.zn-hint{font-size:14px;color:var(--text-secondary);margin:6px 0 0}
</style>
<div class="zn-tabs" role="group" aria-label="Режим">
  <button data-mode="types" aria-pressed="true">Профили типов</button>
  <button data-mode="pair" aria-pressed="false">Стандарт и пример</button>
  <button data-mode="own" aria-pressed="false">Программа по числу мест</button>
</div>
<div class="zn-types" id="zn-types" role="group" aria-label="Тип"></div>
<div class="zn-wrap">
  <svg class="zn-svg" id="zn-svg" viewBox="-50 -8 440 356" role="img" aria-label="Лепестковая диаграмма долей площади"></svg>
  <div class="zn-side" id="zn-side"></div>
</div>
<div class="zn-key" id="zn-key"></div>
<script>
(function () {
  // Доли площади по семи зонам классификатора помещений — от площади помещений
  // и поля, без путей движения и инженерии (их документы считают по-разному) и без
  // открытых площадок (разгрузка, телевизионные машины). м² — из программ записей
  // сайта 2vhutemas.ru (2026-10-14); поле «Яншпортпарка» — расчёт по габаритам дорожки 400 м.
  var AX = ['Место действия', 'Места зрителей', 'Зритель вне зала', 'Исполнители', 'Производство и склады', 'Управление и службы', 'Другие функции'];
  var AXS = ['Действие', 'Зрители', 'Вне зала', 'Исполнители', 'Производство', 'Управление', 'Другое'];
  // DOCS:begin
  var DOCS = [
    {"id": 2083, "name": "Комише-опер, Берлин", "type": "theatre", "doc": "конкурсное задание 2020", "inType": true, "seats": 1190, "m2": [5196, 1584, 840, 6132, 981, 5204, 0], "total": 25119, "note": "зал и фойе в задании одной строкой; мест — 1 190 (по Википедии, в задании числа нет)"},
    {"id": 2071, "name": "Опера в Осло", "type": "theatre", "doc": "брошюра заказчика 2003", "inType": false, "seats": 1969, "m2": [8200, 11200, 0, 0, 19100, 0, 0], "total": 38500, "note": "только три части: публика (зал вместе с фойе), сцена и всё остальное — оно показано как «производство»; в профиль типа не входит"},
    {"id": 2087, "name": "Концертный зал «Таутос намай», Вильнюс", "type": "concert", "doc": "конкурсное задание 2019", "inType": true, "seats": 2000, "m2": [560, 1290, 2575, 1550, 1545, 905, 1000], "total": 9575, "note": "по нижней границе диапазонов; место действия — эстрада, ниша органа, хоровой балкон и сцена Малого зала"},
    {"id": 2084, "name": "Стадион «Яншпортпарк», Берлин", "type": "stadium", "doc": "конкурсное задание 2022", "inType": true, "seats": 20000, "m2": [14530, 9000, 1940, 590, 2167, 1409, 40], "total": 50505, "note": "поле с беговой дорожкой — расчёт по габаритам, в программе задания его нет"},
    {"id": 2082, "name": "Национальный стадион, Рейкьявик", "type": "stadium", "doc": "предтендерная концепция 2017", "inType": true, "seats": 20000, "m2": [10625, 8810, 3118, 638, 1390, 2202, 1000], "total": 31293, "note": "поле с полосой вокруг — по ведомости; места на трибунах — расчёт по размеру места"},
    {"id": 2194, "name": "Pegula Ice Arena, Пенсильвания", "type": "arena", "doc": "программа требований 2010", "inType": true, "seats": 6000, "m2": [3211, 4019, 1841, 2317, 1485, 714, 186], "total": 17597, "note": "два ледовых поля — место действия"},
    {"id": 2086, "name": "Киноцентр «Камеримидж», Торунь", "type": "screen", "doc": "конкурсное задание 2021", "inType": true, "seats": 2050, "m2": [896, 3416, 7708, 107, 2610, 1375, 4006], "total": 53397, "note": "музей, выставки и образование — «другие функции»; киностудия — производство"}
  ];
  // DOCS:end
  var TYPES = [
    { id: 'theatre', name: 'Театр' }, { id: 'concert', name: 'Концертный зал' }, { id: 'stadium', name: 'Стадион' },
    { id: 'arena', name: 'Крытая арена' }, { id: 'screen', name: 'Экран' }
  ];
  var RED = '#A9381F', BLUE = '#2F5D9E', OCHRE = '#8A6414';
  DOCS.forEach(function (d) { var s = d.m2.reduce(function (a, b) { return a + b; }, 0); d.sum = s; d.sh = d.m2.map(function (v) { return v / s * 100; }); });
  TYPES.forEach(function (t) {
    var ds = DOCS.filter(function (d) { return d.type === t.id && d.inType; });
    t.examples = DOCS.filter(function (d) { return d.type === t.id; });
    t.docs = ds;
    t.sh = AX.map(function (_, i) { return ds.reduce(function (a, d) { return a + d.sh[i]; }, 0) / ds.length; });
  });
  var MAX = 60, C = 170, R = 112;
  function pt(i, v) { var a = -Math.PI / 2 + i * 2 * Math.PI / AX.length, r = Math.min(v, MAX) / MAX * R; return [C + r * Math.cos(a), C + r * Math.sin(a)]; }
  function poly(sh) { return sh.map(function (v, i) { return pt(i, v).map(function (n) { return n.toFixed(1); }).join(','); }).join(' '); }
  function f(v) { return (Math.round(v * 10) / 10).toString().replace('.', ','); }
  function sgn(v) { return (v > 0 ? '+' : v < 0 ? '−' : '±') + f(Math.abs(v)); }
  var svg = document.getElementById('zn-svg'), side = document.getElementById('zn-side'), key = document.getElementById('zn-key'), typesBox = document.getElementById('zn-types');
  function draw(layers) {
    var g = '';
    [10, 20, 30, 40, 50, 60].forEach(function (v) { g += '<polygon points="' + poly(AX.map(function () { return v; })) + '" fill="none" stroke="currentColor" stroke-opacity="' + (v === 60 ? .35 : .15) + '" stroke-width=".5"/>'; });
    AX.forEach(function (_, i) { var p = pt(i, MAX); g += '<line x1="' + C + '" y1="' + C + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="currentColor" stroke-opacity=".2" stroke-width=".5"/>'; });
    [20, 40].forEach(function (v) { var p = pt(0, v); g += '<text x="' + (p[0] + 4) + '" y="' + (p[1] + 11) + '">' + v + ' %</text>'; });
    AX.forEach(function (_, i) { var p = pt(i, MAX + 9), anc = Math.abs(p[0] - C) < 8 ? 'middle' : p[0] > C ? 'start' : 'end'; g += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] + 4).toFixed(1) + '" text-anchor="' + anc + '">' + AXS[i] + '</text>'; });
    layers.forEach(function (l) {
      g += '<polygon points="' + poly(l.sh) + '" fill="' + (l.fill ? l.color : 'none') + '" fill-opacity="' + (l.fill ? .18 : 0) + '" stroke="' + l.color + '" stroke-width="' + (l.w || 2) + '"' + (l.dash ? ' stroke-dasharray="5 4"' : '') + ' stroke-linejoin="round"/>';
    });
    svg.style.color = 'var(--text-primary)';
    svg.innerHTML = g;
    key.innerHTML = layers.map(function (l) { return '<span><i style="background:' + l.color + '"></i>' + l.label + '</span>'; }).join('');
  }
  function devTable(rows) {
    var h = '<table><tr><th>Часть</th>' + rows.map(function (r) { return '<th>' + r.head + '</th>'; }).join('') + '</tr>';
    AX.forEach(function (a, i) { h += '<tr><td>' + a + '</td>' + rows.map(function (r) { return '<td>' + r.cell(i) + '</td>'; }).join('') + '</tr>'; });
    return h + '</table>';
  }
  var mode = 'types', cur = 'theatre';
  function typeButtons(onPick, pressed) {
    typesBox.innerHTML = TYPES.map(function (t) { return '<button data-t="' + t.id + '" aria-pressed="' + (t.id === pressed) + '">' + t.name + '</button>'; }).join('');
    Array.prototype.forEach.call(typesBox.querySelectorAll('button'), function (b) { b.onclick = function () { onPick(b.getAttribute('data-t')); }; });
  }
  function showType(id) {
    cur = id; var t = TYPES.filter(function (x) { return x.id === id; })[0];
    typeButtons(showType, id);
    var colors = [BLUE, OCHRE];
    draw([{ sh: t.sh, color: RED, fill: true, label: 'профиль типа: ' + t.name.toLowerCase() }].concat(t.docs.length > 1 ? t.docs.map(function (d, k) { return { sh: d.sh, color: colors[k], dash: true, w: 1.5, label: d.name }; }) : []));
    var rows = [{ head: 'профиль, %', cell: function (i) { return f(t.sh[i]); } }];
    if (t.docs.length > 1) t.docs.forEach(function (d) { rows.push({ head: d.name.split(',')[0] + ', п. п.', cell: function (i) { return sgn(d.sh[i] - t.sh[i]); } }); });
    side.innerHTML = devTable(rows) + '<p class="zn-hint">' + (t.docs.length > 1 ? 'Профиль — среднее ' + t.docs.length + ' документов; в колонках справа — отклонение каждого от среднего, в процентных пунктах.' : 'Профиль по одному документу: ' + t.docs[0].name + ' (' + t.docs[0].doc + '). Это ориентир, а не статистика типа.') + ' ' + t.docs.map(function (d) { return d.name + ': ' + d.note + '.'; }).join(' ') + '</p>';
  }
  var pick = null;
  function n0(v) { return Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function pairShow(id) {
    cur = id || cur; var t = TYPES.filter(function (x) { return x.id === cur; })[0];
    typeButtons(pairShow, cur);
    if (!pick || pick.type !== cur) pick = t.examples[0];
    var sel = '<div class="zn-types" role="group" aria-label="Пример">' + t.examples.map(function (d, k) { return '<button data-k="' + k + '" aria-pressed="' + (d === pick) + '">' + d.name + '</button>'; }).join('') + '</div>';
    var d = pick;
    draw([{ sh: t.sh, color: RED, fill: true, label: 'стандарт: профиль типа «' + t.name.toLowerCase() + '»' }, { sh: d.sh, color: BLUE, dash: true, label: 'пример: ' + d.name }]);
    var base = t.docs.length > 1 ? 'Стандарт — среднее ' + t.docs.length + ' документов типа: ' + t.docs.map(function (x) { return x.name; }).join('; ') + '.' :
      'Стандарт построен по одному документу (' + t.docs[0].name + ')' + (d === t.docs[0] ? ', поэтому пример с ним совпадает.' : '.');
    side.innerHTML = sel + devTable([{ head: 'стандарт, %', cell: function (i) { return f(t.sh[i]); } }, { head: 'пример, %', cell: function (i) { return f(d.sh[i]); } },
      { head: 'разница, п. п.', cell: function (i) { return sgn(d.sh[i] - t.sh[i]); } }, { head: 'пример, м²', cell: function (i) { return d.m2[i] ? n0(d.m2[i]) : '—'; } }]) +
      '<p class="zn-hint">' + d.name + ', ' + d.doc + ': итог программы — ' + n0(d.total) + ' м², в профиле — ' + n0(d.sum) + ' м² (без путей движения, инженерии и стоянок)' +
      (d.m2[0] ? '; место действия — ' + f(d.m2[0] / d.total * 100) + ' % итога программы' : '') + '. ' + d.note.charAt(0).toUpperCase() + d.note.slice(1) + '. ' + base + '</p>';
    Array.prototype.forEach.call(side.querySelectorAll('[data-k]'), function (b) { b.onclick = function () { pick = t.examples[+b.getAttribute('data-k')]; pairShow(cur); }; });
  }
  // Нормы СП 309.1325800.2017 на одно место в зале, м², уровни комфорта 3…1:
  // зал — табл. 3; зритель вне зала — табл. 1 (входная группа, гардероб, санузлы)
  // и табл. 2 (фойе, курительные, кладовая при фойе, буфет): 0,64 + 1,19 … 0,97 + 2,13.
  var NORM = { theatre: { 1: [0.8, 1.0], 2: [1.83, 3.10] }, concert: { 1: [0.6, 1.2], 2: [1.83, 3.10] }, screen: { 1: [0.6, 0.7], 2: [1.83, 3.10] } };
  var FIXED = { stadium: true, arena: true };
  var seats = 0;
  function n0r(v) { var k = v >= 10000 ? 100 : v >= 1000 ? 50 : 10; return n0(Math.round(v / k) * k); }
  function f2(v) { return (Math.round(v * 100) / 100).toString().replace('.', ','); }
  function perSeat(t) {
    return AX.map(function (_, i) {
      var vals = t.docs.map(function (d) { return d.m2[i] / d.seats; }), nr = NORM[t.id] && NORM[t.id][i];
      if (nr) vals = vals.concat(nr);
      // Поле стадиона и арены задано правилами спорта, а не числом мест: площадь постоянная.
      if (i === 0 && FIXED[t.id]) { var a = t.docs.map(function (d) { return d.m2[0]; }); return { fixed: true, lo: Math.min.apply(null, a), hi: Math.max.apply(null, a) }; }
      return { lo: Math.min.apply(null, vals), hi: Math.max.apply(null, vals), norm: !!nr };
    });
  }
  function ownShow(id) {
    cur = id || cur; var t = TYPES.filter(function (x) { return x.id === cur; })[0];
    typeButtons(ownShow, cur);
    if (!document.getElementById('zn-seats')) {
      side.innerHTML = '<div class="zn-in"><label for="zn-seats">Число мест</label><input id="zn-seats" type="number" min="0" step="50" value="' + (seats || '') + '"></div><div id="zn-ownres"></div>';
      document.getElementById('zn-seats').oninput = function () { seats = Math.max(0, parseFloat(this.value.replace(',', '.')) || 0); ownCalc(); };
    }
    ownCalc();
  }
  function ownCalc() {
    var t = TYPES.filter(function (x) { return x.id === cur; })[0], res = document.getElementById('zn-ownres'), ps = perSeat(t);
    var lo = ps.map(function (p) { return p.fixed ? p.lo : p.lo * seats; }), hi = ps.map(function (p) { return p.fixed ? p.hi : p.hi * seats; });
    var sum = function (a) { return a.reduce(function (x, y) { return x + y; }, 0); };
    var mid = AX.map(function (_, i) { return (lo[i] + hi[i]) / 2; }), ms = sum(mid);
    draw([{ sh: t.sh, color: RED, fill: true, label: 'профиль типа «' + t.name.toLowerCase() + '»' }].concat(seats ? [{ sh: mid.map(function (v) { return v / ms * 100; }), color: BLUE, dash: true, label: 'середина диапазонов' }] : []));
    var src = t.docs.map(function (d) { return d.name + ' — ' + n0(d.seats) + ' мест'; }).join('; ');
    var h = '<table><tr><th>Часть</th><th>м² на место</th><th>' + (seats ? 'м², от — до' : 'м²') + '</th></tr>';
    AX.forEach(function (a, i) {
      var p = ps[i], one = Math.abs(p.hi - p.lo) < 0.005;
      var pr = p.fixed ? 'постоянная' : one ? f2(p.lo) : f2(p.lo) + ' — ' + f2(p.hi);
      var ar = p.fixed ? (one ? n0(p.lo) : n0(p.lo) + ' — ' + n0(p.hi)) : seats ? (one ? n0r(lo[i]) : n0r(lo[i]) + ' — ' + n0r(hi[i])) : '—';
      h += '<tr><td>' + a + (p.norm ? ' *' : '') + '</td><td>' + pr + '</td><td>' + ar + '</td></tr>';
    });
    h += '<tr><td><b>Всего</b></td><td></td><td>' + (seats ? '<b>' + n0r(sum(lo)) + ' — ' + n0r(sum(hi)) + '</b>' : '—') + '</td></tr></table>';
    res.innerHTML = h + '<p class="zn-hint">Площадь на одно место — по документам типа (' + src + ')' +
      (NORM[t.id] ? '; * — диапазон расширен нормами СП 309.1325800.2017 для уровней комфорта 1–3: зал — табл. 3, зритель вне зала — табл. 1 и 2' : '') +
      (FIXED[t.id] ? '; место действия не зависит от числа мест: его площадь задают правила спорта, здесь — диапазон по документам' : '') +
      '. Пути движения, инженерия и стоянки — сверх этих площадей. ' + (t.docs.length < 2 && !NORM[t.id] ? 'Тип представлен одним документом, поэтому диапазона нет. ' : '') +
      'Это порядок величин по опубликованным заданиям, а не норматив.</p>';
  }
  function setMode(m) {
    mode = m;
    Array.prototype.forEach.call(document.querySelectorAll('.zn-tabs button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === m)); });
    side.innerHTML = '';
    if (m === 'types') showType(cur); else if (m === 'pair') pairShow(cur); else ownShow(cur);
  }
  Array.prototype.forEach.call(document.querySelectorAll('.zn-tabs button'), function (b) { b.onclick = function () { setMode(b.getAttribute('data-mode')); }; });
  setMode('types');
})();
</script>
</body></html>
